{% extends "typer/base.html" %}
{% block title %}Logowanie — Omega 3 Typer{% endblock %}
{% block content %}
    {% if user.is_authenticated %}
        <h1>Witaj, {{ user.username }}!</h1>
        <p><a href="{% url 'typer:match_list' %}">Lista meczów</a></p>
        <form method="post" action="{% url 'typer:logout' %}">
            {% csrf_token %}
            <button type="submit">Wyloguj</button>
        </form>
    {% else %}
        <h1>Omega 3 Typer</h1>
        <a href="{% url 'typer:login' %}">Zaloguj się</a> |
        <a href="{% url 'typer:register' %}">Zarejestruj się</a>
    {% endif %}
{% endblock %}
