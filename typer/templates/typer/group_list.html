{% extends "typer/base.html" %}

{% block title %}Moje grupy — Omega 3 Typer{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Moje grupy</h2>
    <a href="{% url 'typer:group_create' %}" class="btn btn-primary">Nowa grupa</a>
</div>
<div class="list-group">
    {% for group in groups %}
        <a href="{% url 'typer:group_detail' group.id %}" class="list-group-item list-group-item-action">
            {{ group.name }}
        </a>
    {% empty %}
        <div class="list-group-item text-muted">Nie należysz jeszcze do żadnej grupy.</div>
    {% endfor %}
</div>
{% endblock %}
