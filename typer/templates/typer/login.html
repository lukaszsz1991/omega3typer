{% extends "typer/base.html" %}
{% block title %}Logowanie — Omega 3 Typer{% endblock %}
{% block content %}
<div class="auth-wrap">
    <h1 class="mb-3">Logowanie</h1>
    <div class="auth-panel">
        <form method="post" class="auth-form">
            {% csrf_token %}
            {% include "typer/_auth_form.html" %}
            <button type="submit" class="btn btn-primary w-100">Zaloguj się</button>
        </form>
        <p class="mt-3 mb-1">Nie masz konta? <a href="{% url 'typer:register' %}">Załóż konto</a></p>
        <p class="mb-0"><a href="{% url 'typer:password_reset' %}">Nie pamiętasz hasła?</a></p>
    </div>
</div>
{% endblock %}
