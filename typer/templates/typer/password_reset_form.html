{% extends "typer/base.html" %}
{% block title %}Reset hasła — Omega 3 Typer{% endblock %}
{% block content %}
<div class="auth-wrap">
    <h1 class="mb-3">Reset hasła</h1>
    <div class="auth-panel">
        <p>Podaj adres e-mail konta. Wyślemy link do ustawienia nowego hasła.</p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {% include "typer/_auth_form.html" %}
            <button type="submit" class="btn btn-primary w-100">Wyślij link</button>
        </form>
        <p class="mt-3 mb-0"><a href="{% url 'typer:login' %}">Wróć do logowania</a></p>
    </div>
</div>
{% endblock %}
