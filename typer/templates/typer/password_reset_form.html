{% extends "typer/base.html" %}
{% block title %}Reset hasła — Omega 3 Typer{% endblock %}
{% block content %}
    <h2 class="mb-3">Reset hasła</h2>
    <p>Podaj adres e-mail konta. Wyślemy link do ustawienia nowego hasła.</p>
    <form method="post" class="col-md-5">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Wyślij link</button>
        <a href="{% url 'typer:login' %}" class="btn btn-link">Wróć do logowania</a>
    </form>
{% endblock %}
