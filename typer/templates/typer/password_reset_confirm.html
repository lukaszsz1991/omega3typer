{% extends "typer/base.html" %}
{% block content %}
    {% if validlink %}
        <h2 class="mb-3">Ustaw nowe hasło</h2>
        <form method="post" class="col-md-5">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Zmień hasło</button>
        </form>
    {% else %}
        <h2 class="mb-3">Link jest nieprawidłowy</h2>
        <p>Link wygasł albo został już użyty.</p>
        <a href="{% url 'typer:password_reset' %}" class="btn btn-primary">Poproś o nowy link</a>
    {% endif %}
{% endblock %}
