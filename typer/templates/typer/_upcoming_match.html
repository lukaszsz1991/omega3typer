<div class="list-group-item d-flex justify-content-between align-items-center">
    <div>
        <small class="text-muted">{{ match.league }}</small><br>
        <a href="{% url 'typer:match_detail' match.id %}" class="text-decoration-none">
            {{ match.home_team }} – {{ match.away_team }}
        </a>
    </div>
    <div>
        <span class="badge bg-secondary me-2">{{ match.scheduled_at|date:"d.m.Y H:i" }}</span>
        {% if user.is_authenticated and not match.is_locked %}
            <a href="{% url 'typer:predict' match.id %}" class="btn btn-sm btn-primary">Typuj</a>
        {% endif %}
    </div>
</div>
