<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Omega 3 Typer{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'typer:home' %}">Omega 3 Typer</a>
            <ul class="navbar-nav ms-auto align-items-center">
                {% if user.is_authenticated %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'typer:match_list' %}">Mecze</a></li>
                    <li class="nav-item"><span class="navbar-text mx-3">{{ user.username }}</span></li>
                    <li class="nav-item">
                        <form method="post" action="{% url 'typer:logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-light btn-sm">Wyloguj</button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'typer:login' %}">Zaloguj</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'typer:register' %}">Rejestracja</a></li>
                {% endif %}
            </ul>
        </div>
    </nav>

    <main class="container">
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
